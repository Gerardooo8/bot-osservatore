name: Scansione Mercati

on:
  schedule:
    - cron: '*/15 * * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analizza:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa librerie
        run: pip install yfinance pandas numpy requests

      - name: Esegui osservatore
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python osservatore.py

      - name: Salva registro giornaliero
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Bot Osservatore"
          git add storico_giorno.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Aggiorna registro giornaliero"
          git push
